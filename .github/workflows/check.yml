name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile
      - run: bunx tsc -b
      - run: bun test
      - run: bun run bench:check
      - run: bun run size:check
      - run: bun run check:highlight-consumer
      - run: bun run check:highlight-notices
      - run: bun run check:pack-consumer
      - run: bun run --cwd apps/playground build
      - run: cd apps/playground && bunx playwright install --with-deps chromium
      - run: bun run --cwd apps/playground layout
