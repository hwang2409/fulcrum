name: check
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4, 5, 6, 7, 8] }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile
      - run: cd apps/playground && bunx playwright install --with-deps chromium
      - run: bun run --cwd apps/playground build
      - run: lscpu | grep -E "Model name|^CPU\(s\)"
      - run: bun run --cwd apps/playground layout
        env: { SCALING_ONLY: "1" }
