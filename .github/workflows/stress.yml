name: stress
on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/playground/**"
      - "scripts/**"
      - ".github/workflows/stress.yml"
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: bunx tsc -b
      - run: bun run --cwd apps/playground build
      - run: cd apps/playground && bunx playwright install --with-deps chromium
      - run: bun run stress
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulcrum-stress-artifacts
          path: apps/playground/stress-artifacts/
