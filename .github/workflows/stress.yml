name: stress
on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/playground/**"
      - "scripts/**"
      - ".github/workflows/stress.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inject:
        description: "known-fail sensitivity injection"
        required: false
        type: choice
        options: ["", row-subscription, frame-work, render-work, render-work-small]
jobs:
  stress:
    runs-on: ubuntu-latest
    # 15: run 42741838914/129584516015 cancelled at 9m59s after all steps passed; apt took 4m54s (21.9 MB at 78.7 kB/s), normal run ~5m46s.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: bunx tsc -b
      - run: bun run --cwd packages/highlight build
      - run: bun run --cwd apps/playground build
      # 8: a slow mirror should fail at the named browser-install step, not cancel the whole job.
      - run: cd apps/playground && bunx playwright install --with-deps chromium
        timeout-minutes: 8
      - name: build merge-base for paired comparison
        env:
          BASE_DIR: ${{ github.workspace }}/../fulcrum-stress-base
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            BASE_SHA=$(git merge-base HEAD origin/main)
          else
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          cd "$BASE_DIR"
          bun install --frozen-lockfile
          bunx tsc -b
          bun run --cwd packages/highlight build
          bun run --cwd apps/playground build
      - name: counted-work and retained-heap gates
        if: ${{ inputs.inject == '' }}
        run: |
          bun run --cwd apps/playground stress
          # Ten 4x-throttle runs retained 20/36/41 KiB median/p90/max. The 1 MiB cap is well above noise but catches a retained viewer-sized copy.
          bun apps/playground/scripts/viewer-retention.ts --fixture read --lines 1000000 --warmup 600 --runs 3 --max-growth-kib 1024
      - name: calibrated core a/b report
        env:
          BENCH_BASE_ROOT: ${{ github.workspace }}/../fulcrum-stress-base
          BENCH_CANDIDATE_ROOT: ${{ github.workspace }}
        run: bun scripts/bench-ab.ts
      - name: same-runner calibrated a/b gate
        id: ab
        env:
          BASE_DIR: ${{ github.workspace }}/../fulcrum-stress-base
          STRESS_BASE_ROOT: ${{ github.workspace }}/../fulcrum-stress-base/apps/playground
          STRESS_CANDIDATE_ROOT: ${{ github.workspace }}/apps/playground
          STRESS_BASE_URL: http://127.0.0.1:4174
          STRESS_CANDIDATE_URL: http://127.0.0.1:4173
          STRESS_INJECT: ${{ inputs.inject }}
        run: bun run --cwd apps/playground stress:ab
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fulcrum-stress-artifacts
          path: apps/playground/stress-artifacts/
